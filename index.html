<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:#443957;background:#f9f7fd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0%,#e9dffd 0,transparent 37%),radial-gradient(circle at 100% 90%,#f4e8fb 0,transparent 37%),#faf8fd}main{max-width:1080px;margin:auto;padding:60px 24px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{letter-spacing:.23em;font-size:12px;color:#8b78ac;font-weight:700}.settings{border:1px solid #e4dbef;background:#ffffffaa;color:#796395;border-radius:99px;padding:10px 15px;cursor:pointer;font:inherit;font-size:13px}h1{font-size:clamp(36px,6vw,62px);letter-spacing:-.055em;margin:28px 0 12px;font-weight:750;color:#594775}h1 span{color:#b29ad7}.intro{color:#8d829c;line-height:1.9;margin:0 0 38px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:1px solid #eee8f5;border-radius:26px;padding:17px;box-shadow:0 13px 35px #7863910b;transition:transform .2s,box-shadow .2s;min-height:345px}.card:hover,.card:focus-visible{transform:translateY(-5px);box-shadow:0 18px 35px #78639120;outline:none}.art{height:190px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.art:before,.art:after{content:"";position:absolute;border-radius:50%;background:#ffffff55;width:180px;height:180px;right:-50px;top:-70px}.art:after{width:90px;height:90px;left:-20px;top:auto;bottom:-20px}.art svg{width:115px;height:115px;position:relative;z-index:1;filter:drop-shadow(0 10px 9px #65547b20)}.travel{background:linear-gradient(140deg,#e8dcff,#f4eaff)}.credit{background:linear-gradient(140deg,#fce5f2,#f7eafa)}.cards{background:linear-gradient(140deg,#e4e8ff,#f0eaff)}.content{padding:18px 6px 3px}.small{font-size:11px;letter-spacing:.13em;color:#a08eaf;font-weight:700}.card h2{font-size:21px;margin:7px 0 8px}.card p{font-size:13px;line-height:1.7;color:#93889f;margin:0}.arrow{position:absolute;right:22px;bottom:24px;color:#a88cc9;font-size:22px}.foot{display:flex;align-items:center;justify-content:space-between;gap:15px;color:#a79aaf;font-size:12px;margin-top:45px}.heart{color:#b9a0d7}dialog{border:1px solid #e7ddef;border-radius:24px;max-width:460px;width:calc(100% - 30px);padding:25px;box-shadow:0 30px 90px #43345530}dialog::backdrop{background:#32273a65}dialog h2{margin:0 0 8px;color:#594775}dialog p{font-size:13px;color:#82758d;line-height:1.7}label{display:block;font-size:13px;font-weight:650;margin:16px 0 5px}input{width:100%;border:1px solid #ddd2eb;border-radius:12px;padding:12px;font:inherit;font-size:13px;outline-color:#ae96d5}menu{display:flex;justify-content:flex-end;gap:10px;padding:0;margin:22px 0 0}menu button{border:0;border-radius:12px;padding:12px 17px;font:inherit;cursor:pointer}#save{background:#9578bd;color:white}#cancel{background:#f1edf6;color:#685779}.hint{font-size:12px;color:#aa91b3;margin-top:8px}@media(max-width:800px){main{padding:35px 18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{padding:11px;min-height:290px;border-radius:20px}.art{height:155px;border-radius:14px}.art svg{width:90px;height:90px}.content{padding:14px 5px}.card h2{font-size:17px}.card p{font-size:12px}.arrow{right:15px;bottom:16px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.card{min-height:unset;display:grid;grid-template-columns:125px 1fr;align-items:center;gap:12px;padding:11px}.art{height:132px}.art svg{width:76px;height:76px}.content{padding:4px 22px 4px 0}.card h2{font-size:18px}.arrow{right:14px;bottom:15px}.foot{margin-top:32px}.intro{margin-bottom:27px}h1{margin-top:23px}}
</style>
</head>
<body><main>
<div class="top"><div class="eyebrow">MY PERSONAL SPACE</div><button class="settings" id="openSettings" type="button">⚙ 設定網站連結</button></div>
<h1>Wen's Space <span>♡</span></h1>
<p class="intro">歡迎回到我的小天地 ✦<br>今天想要開啟哪個系統呢？</p>
<section class="grid" aria-label="我的系統">
<a class="card" data-site="travel" href="https://travel-accounting-zeta.vercel.app"><div class="art travel"><svg viewBox="0 0 120 120" fill="none" aria-hidden="true"><rect x="24" y="31" width="72" height="75" rx="17" fill="#B9A2E6"/><rect x="31" y="37" width="58" height="61" rx="12" fill="#D8C8F4"/><path d="M46 32v-8a14 14 0 0 1 28 0v8" stroke="#8972BC" stroke-width="8"/><path d="M43 43v49M77 43v49" stroke="#A991D7" stroke-width="5" stroke-linecap="round"/><circle cx="39" cy="104" r="5" fill="#8069B3"/><circle cx="81" cy="104" r="5" fill="#8069B3"/><path d="m88 16 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/></svg></div><div class="content"><div class="small">01 · TRAVEL</div><h2>旅遊記帳</h2><p>旅行花費、換匯與退稅紀錄</p></div><span class="arrow">↗</span></a>
<a class="card" data-site="credit" href="https://credit-card-accounting.vercel.app"><div class="art credit"><svg viewBox="0 0 120 120" fill="none" aria-hidden="true"><rect x="13" y="28" width="94" height="66" rx="14" fill="#C7A5D8" transform="rotate(-8 13 28)"/><rect x="20" y="24" width="92" height="65" rx="13" fill="#E5BFD9"/><path d="M20 43h92v14H20z" fill="#B48DC5"/><rect x="32" y="67" width="24" height="9" rx="4" fill="#FFF4FC"/><path d="m83 69 4-7 4 7 7 3-7 3-4 7-4-7-7-3z" fill="#fff"/></svg></div><div class="content"><div class="small">02 · FINANCE</div><h2>信用卡記帳</h2><p>刷卡消費、帳單與支出管理</p></div><span class="arrow">↗</span></a>
<a class="card" data-site="draw" href="https://aipritw.vercel.app"><div class="art cards"><svg viewBox="0 0 120 120" fill="none" aria-hidden="true"><rect x="20" y="24" width="66" height="83" rx="10" fill="#B1ADEA" transform="rotate(-13 20 24)"/><rect x="32" y="17" width="68" height="86" rx="10" fill="#D0C9F6"/><rect x="40" y="26" width="52" height="57" rx="7" fill="#EDE9FF"/><path d="m66 39 7 13 14 2-10 10 2 14-13-7-13 7 2-14-10-10 14-2z" fill="#A79DE4"/><path d="M45 91h41" stroke="#A69AD7" stroke-width="5" stroke-linecap="round"/><path d="m98 11 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="white"/></svg></div><div class="content"><div class="small">03 · COLLECTION</div><h2>抽卡紀錄</h2><p>記錄每次抽卡與收藏成果</p></div><span class="arrow">↗</span></a>
</section>
<div class="foot"><span>Made for Wen <span class="heart">♥</span></span><span>One space, all my little things.</span></div>
</main>
<dialog id="settings"><form id="linksForm"><h2>設定網站連結 ♡</h2><p>貼上三個系統的完整網址並儲存。連結只保存在目前瀏覽器，不會修改原本網站。</p><label for="travelUrl">✈ 旅遊記帳</label><input id="travelUrl" type="url" placeholder="https://你的旅遊記帳網站.vercel.app"><label for="creditUrl">💳 信用卡記帳</label><input id="creditUrl" type="url" placeholder="https://你的信用卡網站.vercel.app"><label for="drawUrl">✦ 抽卡紀錄</label><input id="drawUrl" type="url" placeholder="https://你的抽卡網站.vercel.app"><p class="hint">小提醒：若要在所有裝置共用連結，部署時可直接將網址寫入程式設定。</p><menu><button type="button" id="cancel">取消</button><button id="save" type="submit">儲存連結</button></menu></form></dialog>
<script>
const KEYS={travel:'wens-space-travel',credit:'wens-space-credit',draw:'wens-space-draw'};
const DEFAULT_URLS={travel:'https://travel-accounting-zeta.vercel.app',credit:'https://credit-card-accounting.vercel.app',draw:'https://aipritw.vercel.app'};
const modal=document.getElementById('settings');
const getUrl=key=>localStorage.getItem(KEYS[key])||DEFAULT_URLS[key]||'';
function updateLinks(){document.querySelectorAll('[data-site]').forEach(a=>{const url=getUrl(a.dataset.site);a.href=url||'#';a.title=url?'前往'+a.querySelector('h2').textContent:'請先設定網站連結';});}
document.querySelectorAll('[data-site]').forEach(a=>a.addEventListener('click',e=>{if(!getUrl(a.dataset.site)){e.preventDefault();openSettings();}}));
function openSettings(){for(const key of Object.keys(KEYS)){document.getElementById(key+'Url').value=getUrl(key)}modal.showModal();}
document.getElementById('openSettings').onclick=openSettings;
document.getElementById('cancel').onclick=()=>modal.close();
document.getElementById('linksForm').addEventListener('submit',e=>{e.preventDefault();for(const key of Object.keys(KEYS)){const value=document.getElementById(key+'Url').value.trim();if(value&&!/^https?:\/\//i.test(value)){alert('請輸入 http:// 或 https:// 開頭的完整網址');return;}if(value)localStorage.setItem(KEYS[key],value);else localStorage.removeItem(KEYS[key]);}updateLinks();modal.close();});
updateLinks();
</script></body></html>
